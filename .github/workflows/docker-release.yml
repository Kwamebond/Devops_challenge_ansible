name: Hello World with Ansible and Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  hello-world:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: python -m pip install ansible-core

      - name: Run Ansible playbook
        run: ansible-playbook docker-hello.yml

      - name: Publish Dockerfile to GitHub Releases
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" Dockerfile --title "Hello World $GITHUB_REF_NAME" --notes "My first Ansible and Docker Hello World release" --verify-tag
