---
- name: Build and run Hello World with Docker
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Build Docker image
      ansible.builtin.command: docker build -t hello-ansible .

    - name: Run Hello World container
      ansible.builtin.command: docker run --rm hello-ansible
      register: hello_output
      changed_when: false

    - name: Show Hello World output
      ansible.builtin.debug:
        var: hello_output.stdout
